name: Backend Unit Tests

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'pnpm-lock.yaml'
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - 'pnpm-lock.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend unit tests
        run: pnpm test:be
